name: Build and readiness score

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Build, tests and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      score_label: ${{ steps.summary.outputs.score_label }}
      artifact_url: ${{ steps.score_artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        id: build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Verify score reporting
        id: tooling
        if: always()
        continue-on-error: true
        run: npm run test:tooling
      - name: Verify public demo deployment controls
        if: steps.dependencies.outcome == 'success'
        run: node --test test/tooling/demo-gateway.test.mjs test/tooling/demo-updater.test.mjs test/tooling/demo-boot-recovery.test.mjs test/tooling/demo-release-storage.test.mjs
      - name: Install the Chromium test browser
        id: browser
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npx --no-install playwright install --with-deps chromium
      # This delivered path is mandatory even while unrelated rubric stubs remain advisory.
      - name: Verify the working demo flow
        if: steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          npx --no-install vitest run test/core/execution/replay test/core/data/captureLiveFleet.test.ts test/core/data/dataCenters.test.ts test/core/energy/data/siteWeather.test.ts test/core/energy/data/siteWeatherApi.test.ts test/core/data/fleetCaptureApi.test.ts
          node --test test/tooling/replay-cli.test.mjs
          npx --no-install playwright test test/userflows/demo test/userflows/replay test/userflows/fleet --workers=1
      - name: Run requirements and browser flows; calculate score
        id: requirements
        if: always()
        continue-on-error: true
        run: node scripts/score.mjs
      - name: Attach the scorecard and rubric
        id: score_artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-score-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .reports/score.md
            .reports/score.json
            rubric.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish the commit summary
        id: summary
        if: always()
        env:
          SCORE_ARTIFACT_URL: ${{ steps.score_artifact.outputs.artifact-url }}
          INSTALL_RESULT: ${{ steps.dependencies.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          REQUIREMENTS_RESULT: ${{ steps.requirements.outcome }}
        run: node scripts/ci-summary.mjs
      - name: Save tests, score and browser traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: requirements-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .reports/
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Check build and reporting health
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.dependencies.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          REQUIREMENTS_RESULT: ${{ steps.requirements.outcome }}
        run: node scripts/ci-summary.mjs --conclusion

  score:
    name: Score ${{ needs.evidence.outputs.score_label || 'unavailable - CI needs attention' }}
    needs: evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show this commit's progress
        env:
          SCORE_LABEL: ${{ needs.evidence.outputs.score_label || 'unavailable - CI needs attention' }}
        run: |
          printf 'Readiness: %s\n' "$SCORE_LABEL"
          printf 'Open the **Build, tests and evidence** summary for the area breakdown and individual requirements.\n'

  readme:
    name: Update README scorecard links
    needs: [evidence, score]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Refresh the direct run and artifact links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORE_ARTIFACT_URL: ${{ needs.evidence.outputs.artifact_url }}
        run: node scripts/update-scorecard-links.mjs
