name: Build and readiness score

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Build, tests and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cloudflare_manifest_sha256: ${{ steps.cloudflare_package.outputs.manifest_sha256 }}
      cloudflare_artifact_id: ${{ steps.cloudflare_artifact.outputs.artifact-id }}
      score_label: ${{ steps.summary.outputs.score_label }}
      artifact_url: ${{ steps.score_artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        id: build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Verify score reporting
        id: tooling
        if: always()
        continue-on-error: true
        run: npm run test:tooling
      - name: Install the Chromium test browser
        id: browser
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npx --no-install playwright install --with-deps chromium
      - name: Run requirements and browser flows; calculate score
        id: requirements
        if: always()
        continue-on-error: true
        run: node scripts/score.mjs
      - name: Verify hosting, durable storage and real execution contracts
        if: steps.dependencies.outcome == 'success'
        run: node node_modules/vitest/vitest.mjs run test/core/cloudflare test/core/server test/core/jobs
      - name: Verify production demo flows on desktop and mobile
        if: steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: node node_modules/@playwright/test/cli.js test --config playwright.hosting.config.ts
      - name: Verify Cloudflare execution, authentication and durable restart
        if: steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npm run test:cloudflare
      - name: Package the exact Cloudflare release
        id: cloudflare_package
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
        run: node scripts/package-cloudflare.mjs
      - name: Verify the packaged production Worker in workerd
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
        run: node scripts/smoke-cloudflare-package.mjs .cache/cloudflare/release
      - name: Preserve the verified deployment artifact
        id: cloudflare_artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .cache/cloudflare/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Attach the scorecard and rubric
        id: score_artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-score-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .reports/score.md
            .reports/score.json
            rubric.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish the commit summary
        id: summary
        if: always()
        env:
          SCORE_ARTIFACT_URL: ${{ steps.score_artifact.outputs.artifact-url }}
          INSTALL_RESULT: ${{ steps.dependencies.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          REQUIREMENTS_RESULT: ${{ steps.requirements.outcome }}
        run: node scripts/ci-summary.mjs
      - name: Save tests, score and browser traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: requirements-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .reports/
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Check build and reporting health
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.dependencies.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          REQUIREMENTS_RESULT: ${{ steps.requirements.outcome }}
        run: node scripts/ci-summary.mjs --conclusion

  score:
    name: Score ${{ needs.evidence.outputs.score_label || 'unavailable - CI needs attention' }}
    needs: evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show this commit's progress
        env:
          SCORE_LABEL: ${{ needs.evidence.outputs.score_label || 'unavailable - CI needs attention' }}
        run: |
          printf 'Readiness: %s\n' "$SCORE_LABEL"
          printf 'Open the **Build, tests and evidence** summary for the area breakdown and individual requirements.\n'

  readme:
    name: Update README scorecard links
    needs: [evidence, score]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Refresh the direct run and artifact links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORE_ARTIFACT_URL: ${{ needs.evidence.outputs.artifact_url }}
        run: node scripts/update-scorecard-links.mjs

  cloudflare_deploy:
    name: Deploy tested Cloudflare artifact
    needs: evidence
    if: ${{ needs.evidence.result == 'success' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-demo
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cloudflare-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.evidence.outputs.cloudflare_artifact_id }}
          path: .cache/cloudflare/release
      - name: Verify approved commit and immutable artifact
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.evidence.outputs.cloudflare_manifest_sha256 }}
        run: node scripts/verify-cloudflare-package.mjs .cache/cloudflare/release --commit "$GITHUB_SHA" --manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
      - name: Deploy the verified bundle without rebuilding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: node node_modules/wrangler/bin/wrangler.js deploy --no-bundle --config .cache/cloudflare/release/wrangler.json
